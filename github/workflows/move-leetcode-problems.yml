name: Move LeetHub problems into folder

on:
  push:
    branches: [main]
  workflow_dispatch:n]   # change to master if that's your default branch

permissions:
  contents: write

env:
  TARGET_DIR: LeetCode # <- change this to your folder name

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Move problem folders into target dir
        run: |
          mkdir -p "$TARGET_DIR"
          for d in [0-9][0-9][0-9][0-9]-*/; do
            [ -d "$d" ] || continue
            d="${d%/}"
            if [ -e "$TARGET_DIR/$d" ]; then
              # problem already moved before: merge the newer files, drop the root copy
              cp -r "$d"/. "$TARGET_DIR/$d"/
              git rm -rq "$d"
            else
              git mv "$d" "$TARGET_DIR/$d"
            fi
          done
          git add -A "$TARGET_DIR"

      - name: Commit and push if anything moved
        run: |
          if git diff --cached --quiet; then
            echo "Nothing to move."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Move LeetHub problems into $TARGET_DIR/"
          git push
